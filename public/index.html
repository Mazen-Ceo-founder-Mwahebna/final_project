<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="MetroSync Live admin sign in and passenger station dashboard."
    />
    <title>MetroSync Live | Sign in</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body class="auth-page">
    <main class="auth-shell">
      <section class="auth-hero" aria-labelledby="auth-title">
        <div class="brand-lockup">
          <img src="/images/metro.gif" alt="" class="brand-mark" />
          <span>MetroSync Live</span>
        </div>

        <div class="auth-copy">
          <p class="eyebrow">Line 1 Operations</p>
          <h1 id="auth-title">MetroSync Live</h1>
          <p>
            Real-time station awareness for passengers and admins across the
            line.
          </p>
        </div>
      </section>

      <section class="login-panel" aria-label="Admin sign in">
        <div class="panel-heading">
          <p class="eyebrow">Admin Portal</p>
          <h2>Sign in</h2>
        </div>

        <form id="login-form" class="login-form">
          <label for="email">Email</label>
          <input
            type="email"
            id="email"
            autocomplete="email"
            placeholder="admin@metrosync.com"
            required
          />

          <label for="password">Password</label>
          <input
            type="password"
            id="password"
            autocomplete="current-password"
            placeholder="Enter password"
            required
          />

          <button type="submit" class="btn btn-primary btn-block">
            Login as Admin
          </button>
        </form>

        <p class="hint">
          Seeded admin <code>admin@metrosync.com / Admin123!</code>
        </p>
        <p id="login-error" class="error-text" role="alert"></p>

        <div class="panel-divider"><span>Passenger access</span></div>
        <a href="/passenger.html" class="btn btn-secondary btn-block">
          Open Passenger View
        </a>
      </section>
    </main>

    <script>
      const token = localStorage.getItem("adminToken");
      if (token) {
        window.location.href = "/admin-panel.html";
      }

      const loginForm = document.getElementById("login-form");
      const loginError = document.getElementById("login-error");
      const loginButton = loginForm.querySelector("button");

      loginForm.addEventListener("submit", async (e) => {
        e.preventDefault();
        loginError.textContent = "";
        loginButton.disabled = true;
        loginButton.textContent = "Signing in...";

        const email = document.getElementById("email").value.trim();
        const password = document.getElementById("password").value.trim();

        try {
          const res = await fetch("/api/v1/auth/login", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ email, password }),
          });

          if (!res.ok) {
            const body = await res.json();
            loginError.textContent = body.message || "Login failed";
            return;
          }

          const data = await res.json();
          localStorage.setItem("adminToken", data.token);
          window.location.href = "/admin-panel.html";
        } catch (err) {
          loginError.textContent = "Network error. Please try again.";
        } finally {
          loginButton.disabled = false;
          loginButton.textContent = "Login as Admin";
        }
      });
    </script>
  </body>
</html>
