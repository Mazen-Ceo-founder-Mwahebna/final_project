<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Signin</title>
    <link rel="stylesheet" href="/styles.css" />
    <style>
      .home-container {
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 24px;
        background: linear-gradient(
            135deg,
            rgba(59, 169, 215, 0.1) 0%,
            rgba(216, 68, 68, 0.1) 100%
          ),
          url("/images/metro-bg.jpg") center/cover no-repeat;
        background-attachment: fixed;
      }

      .home-card {
        background: #ffffff;
        border-radius: 16px;
        padding: 40px;
        box-shadow: 0 2px 8px rgba(26, 31, 38, 0.1);
        max-width: 400px;
        width: 100%;
      }

      .home-card h1 {
        text-align: center;
        margin-top: 0;
        color: #1a1f26;
      }

      .home-card form {
        display: flex;
        flex-direction: column;
        gap: 0;
      }

      .home-card label {
        margin-bottom: 4px;
      }

      .home-card input {
        margin-bottom: 16px;
      }

      .home-card button {
        margin-bottom: 16px;
      }

      .home-card .hint {
        font-size: 12px;
        color: #5a6276;
        margin: 12px 0;
        text-align: center;
      }

      .home-card code {
        background: #f5f6f7;
        padding: 4px 8px;
        border-radius: 4px;
        font-family: monospace;
      }

      .home-card .error-text {
        margin-top: 8px;
        text-align: center;
      }

      .passenger-btn {
        background: #3ba9d7;
        color: white;
        padding: 10px 18px;
        border-radius: 999px;
        border: none;
        width: 50%;
        font-weight: 600;
        cursor: pointer;
        display: block;
        margin: 0 auto;
        text-align: center;
        text-decoration: none;
        font-size: 14px;
        box-shadow: 0 4px 12px rgba(59, 169, 215, 0.3);
        transition: all 0.2s ease;
      }

      .passenger-btn:hover {
        background: #2a92c0;
        box-shadow: 0 6px 16px rgba(59, 169, 215, 0.4);
        transform: translateY(-2px);
      }
    </style>
  </head>
  <body>
    <div class="home-container">
      <div class="home-card">
        <h1>MetroSync Live</h1>

        <form id="login-form">
          <label>Email</label>
          <input type="email" id="email" required />
          <label>Password</label>
          <input type="password" id="password" required />
          <button type="submit" class="btn">Login as Admin</button>
        </form>

        <p class="hint">
          Seeded admin: <code>admin@metrosync.com / Admin123!</code>
        </p>
        <p id="login-error" class="error-text"></p>

        <a href="/passenger.html" class="passenger-btn">I'm a Passenger</a>
      </div>
    </div>

    <script>
      // Check if admin is already logged in
      const token = localStorage.getItem("adminToken");
      if (token) {
        window.location.href = "/admin-panel.html";
      }

      // Handle admin login
      const loginForm = document.getElementById("login-form");
      const loginError = document.getElementById("login-error");

      loginForm.addEventListener("submit", async (e) => {
        e.preventDefault();
        loginError.textContent = "";
        const email = document.getElementById("email").value.trim();
        const password = document.getElementById("password").value.trim();
        try {
          const res = await fetch("/api/v1/auth/login", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ email, password }),
          });
          if (!res.ok) {
            const body = await res.json();
            loginError.textContent = body.message || "Login failed";
            return;
          }
          const data = await res.json();
          localStorage.setItem("adminToken", data.token);
          window.location.href = "/admin-panel.html";
        } catch (err) {
          loginError.textContent = "Network error";
        }
      });
    </script>
  </body>
</html>
