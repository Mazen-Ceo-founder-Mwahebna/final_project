<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Passenger</title>
    <link rel="stylesheet" href="/styles.css" />
    <script>
      // Preload stations and train position before page fully loads
      window.preloadedData = {
        stations: [],
        trainPosition: null,
      };

      // Fetch stations
      fetch("/api/v1/stations")
        .then((res) => res.json())
        .then((data) => {
          window.preloadedData.stations = data;
        })
        .catch((err) => console.error("Failed to preload stations:", err));
    </script>
  </head>
  <body>
    <div class="layout">
      <header>
        <img src="/images/metro.gif" alt="MetroSync Logo" class="icon" />
        <h1 id="station-title">Select Station</h1>
        <a href="/" class="btn">Sign In As Admin</a>
      </header>

      <div class="dashboard-grid">
        <div class="dashboard-left">
          <div class="station-selector">
            <label for="station-select">Select Station</label>
            <select id="station-select"></select>
          </div>

          <div class="metro-section">
            <h2 id="map-title">Select Station</h2>
            <div class="map-line-container">
              <div id="map-line" class="map-line">
                <!-- dynamic train + stations -->
              </div>
            </div>
            <p id="viewers-text" class="viewers-text">Live viewers: 0</p>
          </div>
        </div>

        <div class="dashboard-right">
          <div class="announcements-panel">
            <h2>Announcements</h2>
            <ul id="announcement-list" class="announcement-list"></ul>
          </div>
        </div>
      </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script type="module" src="/shared-utils.js"></script>
    <script type="module" src="/passenger.js"></script>
  </body>
</html>
