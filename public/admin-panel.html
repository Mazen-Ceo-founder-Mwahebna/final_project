<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="MetroSync Live admin dashboard for station announcements."
    />
    <title>MetroSync Live | Admin</title>
    <link rel="stylesheet" href="/styles.css" />
    <script>
      window.preloadedData = {
        stations: [],
        trainPosition: null,
      };

      fetch("/api/v1/stations", {
        headers: {
          Authorization: "Bearer " + localStorage.getItem("adminToken"),
        },
      })
        .then((res) => res.json())
        .then((data) => {
          window.preloadedData.stations = data;
        })
        .catch((err) => console.error("Failed to preload stations:", err));
    </script>
  </head>
  <body class="app-page admin-page">
    <div class="layout">
      <header class="app-header">
        <a href="/admin-panel.html" class="brand-lockup compact">
          <img src="/images/metro.gif" alt="" class="brand-mark" />
          <span>MetroSync Live</span>
        </a>

        <div class="header-title">
          <p class="eyebrow">Admin Console</p>
          <h1 id="admin-station-title">Select Station</h1>
        </div>

        <a href="/" class="btn btn-primary" id="logout-link">Logout</a>
      </header>

      <main class="dashboard-grid">
        <section class="dashboard-left" aria-label="Station controls">
          <div class="station-selector panel">
            <div>
              <label for="admin-station-select">Station</label>
              <p>Select a station before sending an announcement.</p>
            </div>
            <select id="admin-station-select"></select>
          </div>

          <div class="metric-grid" aria-label="Station summary">
            <div class="metric-card">
              <span>Selected</span>
              <strong id="admin-selected-station-stat">None</strong>
            </div>
            <div class="metric-card">
              <span>Stations</span>
              <strong id="admin-station-count-stat">0</strong>
            </div>
            <div class="metric-card accent">
              <span>Live viewers</span>
              <strong id="admin-viewers-count-stat">0</strong>
            </div>
          </div>

          <div class="metro-section panel">
            <div class="section-heading">
              <div>
                <p class="eyebrow">Line Map</p>
                <h2 id="map-title">Select Station</h2>
              </div>
              <span class="line-chip">Line 1</span>
            </div>

            <div class="map-line-container">
              <div
                id="admin-map-line"
                class="map-line"
                aria-label="Metro line stations"
              ></div>
            </div>

            <p id="admin-viewers-text" class="viewers-text">Live viewers: 0</p>
          </div>
        </section>

        <aside class="dashboard-right" aria-label="Announcements">
          <div class="announcements-panel panel">
            <div class="section-heading">
              <div>
                <p class="eyebrow">Live Feed</p>
                <h2>Announcements</h2>
              </div>
            </div>
            <ul
              id="admin-announcement-list"
              class="announcement-list"
              aria-live="polite"
            ></ul>

            <form id="announcement-form" class="announcement-form">
              <label for="announcement-text">Announcement</label>
              <textarea
                id="announcement-text"
                maxlength="240"
                placeholder="Type an announcement..."
                required
              ></textarea>
              <div class="form-actions">
                <span id="announcement-count" class="character-count"
                  >0 / 240</span
                >
                <button type="submit" class="btn btn-secondary">
                  Send Announcement
                </button>
              </div>
            </form>
            <p id="announcement-error" class="error-text" role="alert"></p>
          </div>
        </aside>
      </main>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script type="module" src="/shared-utils.js"></script>
    <script type="module" src="/admin-panel.js"></script>
  </body>
</html>
